<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1200" height="760" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="42" text-anchor="middle" font-size="26" font-weight="700" fill="#0f172a">3-Tier AWS Architecture — Terraform</text>
  <text x="600" y="66" text-anchor="middle" font-size="14" fill="#64748b">project-06-3tier · Provisioned end-to-end with Terraform</text>

  <!-- Internet -->
  <circle cx="90" cy="180" r="34" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="90" y="176" text-anchor="middle" font-size="20">🌐</text>
  <text x="90" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#0369a1">Internet</text>
  <text x="90" y="246" text-anchor="middle" font-size="11" fill="#64748b">Users / Clients</text>

  <!-- Arrow Internet -> IGW -->
  <line x1="126" y1="180" x2="192" y2="180" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- VPC boundary -->
  <rect x="200" y="100" width="960" height="620" rx="14" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="8,5"/>
  <text x="222" y="126" font-size="15" font-weight="700" fill="#1d4ed8">VPC — 10.0.0.0/16</text>

  <!-- IGW box -->
  <rect x="640" y="150" width="180" height="46" rx="8" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="730" y="178" text-anchor="middle" font-size="14" font-weight="600" fill="#854d0e">Internet Gateway</text>
  <line x1="820" y1="173" x2="880" y2="173" stroke="#ca8a04" stroke-width="0" />

  <!-- connect IGW to internet arrow path (elbow) -->
  <path d="M 192 180 L 220 180 L 220 173 L 640 173" fill="none" stroke="#0284c7" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  <!-- ============ AZ 1 ============ -->
  <text x="330" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Availability Zone — 1a</text>
  <!-- Public subnet AZ1 -->
  <rect x="230" y="250" width="200" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="330" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Public Subnet 1</text>
  <text x="330" y="288" text-anchor="middle" font-size="11" fill="#3b82f6">10.0.1.0/24</text>
  <rect x="255" y="298" width="150" height="30" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="330" y="318" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">ALB Node</text>

  <!-- Private App subnet AZ1 -->
  <rect x="230" y="365" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="330" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">Private App Subnet 1</text>
  <text x="330" y="403" text-anchor="middle" font-size="11" fill="#22c55e">10.0.11.0/24</text>
  <rect x="248" y="413" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="278" y="431" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">EC2</text>
  <rect x="352" y="413" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="382" y="431" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">EC2</text>

  <!-- Private DB subnet AZ1 -->
  <rect x="230" y="480" width="200" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="330" y="502" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">Private DB Subnet 1</text>
  <text x="330" y="518" text-anchor="middle" font-size="11" fill="#ef4444">10.0.21.0/24</text>

  <!-- ============ AZ 2 ============ -->
  <text x="590" y="235" text-anchor="middle" font-size="13" font-weight="700" fill="#334155">Availability Zone — 1b</text>
  <!-- Public subnet AZ2 -->
  <rect x="490" y="250" width="200" height="90" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="590" y="272" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af">Public Subnet 2</text>
  <text x="590" y="288" text-anchor="middle" font-size="11" fill="#3b82f6">10.0.2.0/24</text>
  <rect x="515" y="298" width="150" height="30" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
  <text x="590" y="318" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">ALB Node</text>

  <!-- Private App subnet AZ2 -->
  <rect x="490" y="365" width="200" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="590" y="387" text-anchor="middle" font-size="12" font-weight="600" fill="#15803d">Private App Subnet 2</text>
  <text x="590" y="403" text-anchor="middle" font-size="11" fill="#22c55e">10.0.12.0/24</text>
  <rect x="508" y="413" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="538" y="431" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">EC2</text>
  <rect x="612" y="413" width="60" height="28" rx="5" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/>
  <text x="642" y="431" text-anchor="middle" font-size="10" font-weight="600" fill="#166534">EC2</text>

  <!-- Private DB subnet AZ2 -->
  <rect x="490" y="480" width="200" height="80" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="590" y="502" text-anchor="middle" font-size="12" font-weight="600" fill="#b91c1c">Private DB Subnet 2</text>
  <text x="590" y="518" text-anchor="middle" font-size="11" fill="#ef4444">10.0.22.0/24</text>

  <!-- Shared components column: ALB label, ASG box, RDS -->
  <!-- ALB summary box -->
  <rect x="760" y="270" width="160" height="50" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
  <text x="840" y="291" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Application</text>
  <text x="840" y="307" text-anchor="middle" font-size="13" font-weight="700" fill="#c2410c">Load Balancer</text>

  <!-- ASG summary box -->
  <rect x="760" y="385" width="160" height="50" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="840" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Auto Scaling</text>
  <text x="840" y="422" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">Group</text>

  <!-- RDS cylinder -->
  <g>
    <path d="M 760 495 Q 840 480 920 495 L 920 545 Q 840 560 760 545 Z" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <ellipse cx="840" cy="495" rx="80" ry="12" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <text x="840" y="524" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">RDS Database</text>
    <text x="840" y="540" text-anchor="middle" font-size="10" fill="#b91c1c">DB Subnet Group</text>
  </g>

  <!-- Connecting arrows: public subnets -> ALB summary -->
  <path d="M 430 295 L 480 295 L 480 295 L 760 295" fill="none" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 690 295 L 760 295" fill="none" stroke="#ea580c" stroke-width="0"/>
  <!-- ALB -> ASG -->
  <line x1="840" y1="320" x2="840" y2="385" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>
  <!-- ALB -> App subnets (both AZ) forwarding -->
  <path d="M 760 295 L 690 295 L 690 300 L 430 300" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="330" y1="340" x2="330" y2="365" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="340" x2="590" y2="365" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- App subnets -> ASG summary -->
  <path d="M 430 410 L 760 410" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 690 410 L 760 410" fill="none" stroke="#059669" stroke-width="0"/>

  <!-- ASG -> RDS -->
  <line x1="840" y1="435" x2="840" y2="490" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- App subnets -> DB subnets (query path) -->
  <line x1="330" y1="455" x2="330" y2="480" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="590" y1="455" x2="590" y2="480" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- DB subnets -> RDS -->
  <path d="M 430 520 L 760 520" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 690 520 L 760 520" fill="none" stroke="#dc2626" stroke-width="0"/>

  <!-- Legend / Notes -->
  <rect x="230" y="600" width="690" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="250" y="625" font-size="13" font-weight="700" fill="#0f172a">Notes</text>
  <text x="250" y="646" font-size="11.5" fill="#334155">• No NAT Gateway in this build — private subnets have no outbound internet (cost-optimized demo setup)</text>
  <text x="250" y="664" font-size="11.5" fill="#334155">• Security Groups enforce strict tier-to-tier access: ALB → App tier → DB tier only</text>
  <text x="250" y="682" font-size="11.5" fill="#334155">• Entire stack (VPC, ALB, ASG, RDS, SGs) is provisioned via a single `terraform apply`</text>

  <text x="1150" y="745" text-anchor="end" font-size="10" fill="#94a3b8">Built with Terraform · AWS</text>
</svg>
