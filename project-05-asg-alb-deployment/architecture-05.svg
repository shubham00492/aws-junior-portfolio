<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="420" fill="#0b0f17"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#46d3c4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="450" y="36" text-anchor="middle" fill="#e7ebf3" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Auto Scaling + Application Load Balancer</text>

  <!-- Browser -->
  <rect x="40" y="170" width="130" height="80" rx="10" fill="#121826" stroke="#232d42" stroke-width="1.5"/>
  <text x="105" y="205" text-anchor="middle" fill="#e7ebf3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Browser</text>
  <text x="105" y="224" text-anchor="middle" fill="#8994ab" font-family="Arial, Helvetica, sans-serif" font-size="11">client</text>

  <line x1="170" y1="210" x2="270" y2="210" stroke="#46d3c4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="200" text-anchor="middle" fill="#8994ab" font-family="Arial, Helvetica, sans-serif" font-size="11">HTTP :80</text>

  <!-- ALB -->
  <rect x="270" y="150" width="170" height="120" rx="10" fill="#121826" stroke="#46d3c4" stroke-width="2"/>
  <text x="355" y="188" text-anchor="middle" fill="#e7ebf3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Application</text>
  <text x="355" y="206" text-anchor="middle" fill="#e7ebf3" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600">Load Balancer</text>
  <text x="355" y="228" text-anchor="middle" fill="#46d3c4" font-family="Arial, Helvetica, sans-serif" font-size="11">internet-facing</text>
  <text x="355" y="245" text-anchor="middle" fill="#8994ab" font-family="Arial, Helvetica, sans-serif" font-size="11">target group</text>

  <!-- Lines to EC2 instances -->
  <line x1="440" y1="180" x2="560" y2="90" stroke="#46d3c4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="210" x2="560" y2="210" stroke="#46d3c4" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="440" y1="240" x2="560" y2="330" stroke="#46d3c4" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- EC2 instance boxes -->
  <rect x="560" y="50" width="280" height="80" rx="10" fill="#121826" stroke="#232d42" stroke-width="1.5"/>
  <text x="700" y="80" text-anchor="middle" fill="#e7ebf3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">EC2 — Availability Zone us-east-1a</text>
  <text x="700" y="100" text-anchor="middle" fill="#8994ab" font-family="Arial, Helvetica, sans-serif" font-size="11">t3.micro · Apache httpd</text>
  <text x="700" y="117" text-anchor="middle" fill="#8994ab" font-family="Arial, Helvetica, sans-serif" font-size="11">launched from launch template</text>

  <rect x="560" y="170" width="280" height="80" rx="10" fill="#121826" stroke="#232d42" stroke-width="1.5"/>
  <text x="700" y="200" text-anchor="middle" fill="#e7ebf3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">EC2 — Availability Zone us-east-1b</text>
  <text x="700" y="220" text-anchor="middle" fill="#8994ab" font-family="Arial, Helvetica, sans-serif" font-size="11">t3.micro · Apache httpd</text>
  <text x="700" y="237" text-anchor="middle" fill="#8994ab" font-family="Arial, Helvetica, sans-serif" font-size="11">launched from launch template</text>

  <rect x="560" y="290" width="280" height="80" rx="10" fill="#121826" stroke="#232d42" stroke-width="1.5"/>
  <text x="700" y="320" text-anchor="middle" fill="#e7ebf3" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">EC2 — Availability Zone us-east-1e</text>
  <text x="700" y="340" text-anchor="middle" fill="#8994ab" font-family="Arial, Helvetica, sans-serif" font-size="11">t3.micro · Apache httpd</text>
  <text x="700" y="357" text-anchor="middle" fill="#8994ab" font-family="Arial, Helvetica, sans-serif" font-size="11">launched from launch template</text>

  <!-- Auto Scaling Group boundary -->
  <rect x="545" y="35" width="310" height="350" rx="14" fill="none" stroke="#2a3450" stroke-width="1.5" stroke-dasharray="6,5"/>
  <text x="700" y="405" text-anchor="middle" fill="#46d3c4" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="600">Auto Scaling Group — min 2 / desired 3 / max 5</text>
</svg>
